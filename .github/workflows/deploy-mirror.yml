name: Build and deploy mirror

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - 'install-mirror.sh'
      - 'CNAME'
      - '.github/workflows/deploy-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mirror-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Build Debian packages
        run: |
          chmod +x scripts/*.sh install-mirror.sh
          find packages -path '*/src/usr/bin/*' -exec chmod +x {} +
          find packages -path '*/debian/postinst' -exec chmod +x {} +
          ./scripts/build-all.sh

      - name: Assemble site, APT repo, and packages.json
        run: ./scripts/publish-apt-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
